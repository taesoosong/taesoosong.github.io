# Homepage news / updates. Newest first. Keep entries terse.
# `text` accepts Markdown (links, *italics*). Adjust dates/wording freely.
- date: "Oct 2026"
  year: 2026
  text: "I will be presenting research on affordable housing preservation at a Terner Center for Housing Innovation webinar ([*When NOAH Changes Hands: Scaling up Strategies for Long-Term Affordability*](https://ternercenter.berkeley.edu/blog/when-noah-changes-hands-scaling-up-strategies-for-long-term-affordability/)) and at the Association of Collegiate Schools of Planning (ACSP) Annual Conference in Pittsburgh."

- date: "Sep 2026"
  year: 2026
  text: "New policy brief, [*Foreign Buyer Taxes and the Rental Affordability Gap*](https://schoolofcities.github.io/posts/foreign-buyer-tax-vancouver-toronto/), published by the School of Cities at the University of Toronto."

- date: "Aug 2026"
  year: 2026
  text: "New book review in [*Journal of Urban Affairs*](https://doi.org/10.1080/07352166.2026.2707017), on Lauren E. M. Everett's *Fortunate People in a Fortunate Land: At Home in Santa Monica's Rent-Controlled Housing*."

- date: "May 2026"
  year: 2026
  text: "I completed my Ph.D. in City and Regional Planning at UC Berkeley. I'll be joining Virginia Tech's Urban & Environmental Policy & Planning program (Arlington campus) as an Assistant Professor this fall!"

- date: "Apr 2026"
  year: 2026
  text: "New article on upzoning and residential mobility published in [*Housing Policy Debate*](https://www.tandfonline.com/doi/full/10.1080/10511482.2026.2649483) with Jenna Davis and Karen Chapple."

- date: "Feb 2026"
  year: 2026
  text: "New article on naturally occurring affordable housing (NOAH) and residential mobility published in [*Journal of the American Planning Association*](https://www.tandfonline.com/doi/full/10.1080/01944363.2026.2618647) with Carolina Reid."
