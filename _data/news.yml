# Homepage news / updates. Newest first. Keep entries terse.
# `text` accepts Markdown (links, *italics*). Adjust dates/wording freely.
- date: "Oct 2026"
  year: 2026
  text: "I presented research on NOAH sales and tenant stability for practitioners at a Terner Center for Housing Innovation webinar, [*When NOAH Changes Hands: Scaling up Strategies for Long-Term Affordability*](https://ternercenter.berkeley.edu/blog/when-noah-changes-hands-scaling-up-strategies-for-long-term-affordability/). This study was also published as a Terner Center blog post, [*Preserving NOAH as an Anti-Displacement Strategy*](https://ternercenter.berkeley.edu/blog/preserving-noah-as-an-anti-displacement-strategy/)."

- date: "Oct 2026"
  year: 2026
  text: "Carolina Reid and I received the [*Journal of the American Planning Association* 2026 Article of the Year award](https://www.planning.org/blog/9337444/what-award-winning-japa-research-reveals-about-affordable-housing-and-racial-equity-planning/) from the American Planning Association for *The Implications of Naturally Occurring Affordable Housing (NOAH) Sales for Residential Mobility*."

- date: "Oct 2026"
  year: 2026
  text: "I was interviewed for the *San Francisco Chronicle* article [\"Chinese Americans once flocked to S.F.'s Chinatown and the west side. Now they're moving elsewhere.\"](https://www.sfchronicle.com/sf/article/chinese-americans-san-francisco-neighborhoods-22458761.php)"

- date: "Oct 2026"
  year: 2026
  text: "I presented new research on NOAH sales and renovation in New York City's rent-stabilized apartments at the Association of Collegiate Schools of Planning (ACSP) Annual Conference in Pittsburgh."

- date: "Sep 2026"
  year: 2026
  text: "New policy brief, [*Foreign Buyer Taxes and the Rental Affordability Gap*](https://schoolofcities.github.io/posts/foreign-buyer-tax-vancouver-toronto/), published by the School of Cities at the University of Toronto."

- date: "Aug 2026"
  year: 2026
  text: "New book review in [*Journal of Urban Affairs*](https://doi.org/10.1080/07352166.2026.2707017), on Lauren E. M. Everett's *Fortunate People in a Fortunate Land: At Home in Santa Monica's Rent-Controlled Housing*."

- date: "May 2026"
  year: 2026
  text: "I completed my Ph.D. in City and Regional Planning at UC Berkeley. I'll be joining Virginia Tech's Urban & Environmental Policy & Planning program (Arlington campus) as an Assistant Professor this fall!"

- date: "Apr 2026"
  year: 2026
  text: "New article on upzoning and residential mobility published in [*Housing Policy Debate*](https://www.tandfonline.com/doi/full/10.1080/10511482.2026.2649483) with Jenna Davis and Karen Chapple."

- date: "Feb 2026"
  year: 2026
  text: "New article on naturally occurring affordable housing (NOAH) and residential mobility published in [*Journal of the American Planning Association*](https://www.tandfonline.com/doi/full/10.1080/01944363.2026.2618647) with Carolina Reid."
